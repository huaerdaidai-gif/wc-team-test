<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单 Todo List</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      height: fit-content;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-color);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
    }

    .input-group button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .input-group button:hover {
      background-color: var(--primary-hover);
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .todo-item:hover {
      background-color: #f3f4f6;
    }

    .todo-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .todo-text {
      font-size: 1rem;
      word-break: break-all;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background-color 0.2s;
      line-height: 1;
    }

    .delete-btn:hover {
      background-color: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办清单</h1>

    <form id="todo-form" class="input-group">
      <input type="text" id="todo-input" placeholder="添加新的待办事项..." autocomplete="off" required>
      <button type="submit">添加</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">暂无待办事项</div>
  </div>

  <script>
    const STORAGE_KEY = 'todos';
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');

    // Fetch todos from localStorage
    function getTodos() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    // Save todos to localStorage
    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Render todos
    function renderTodos() {
      const todos = getTodos();
      todoList.innerHTML = '';

      if (todos.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

        const leftDiv = document.createElement('div');
        leftDiv.className = 'todo-item-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        leftDiv.appendChild(checkbox);
        leftDiv.appendChild(span);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = '删除';
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(leftDiv);
        li.appendChild(deleteBtn);

        todoList.appendChild(li);
      });
    }

    // Add todo
    function addTodo(text) {
      const todos = getTodos();
      const newTodo = {
        id: Date.now().toString(),
        text: text.trim(),
        completed: false
      };
      todos.push(newTodo);
      saveTodos(todos);
      renderTodos();
    }

    // Toggle todo status
    function toggleTodo(id) {
      const todos = getTodos();
      const updatedTodos = todos.map(todo => {
        if (todo.id === id) {
          return { ...todo, completed: !todo.completed };
        }
        return todo;
      });
      saveTodos(updatedTodos);
      renderTodos();
    }

    // Delete todo
    function deleteTodo(id) {
      const todos = getTodos();
      const updatedTodos = todos.filter(todo => todo.id === id);
      saveTodos(updatedTodos);
      renderTodos();
    }

    // Form submit event
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (text) {
        addTodo(text);
        todoInput.value = '';
      }
    });

    // Initial render
    renderTodos();
  </script>
</body>
</html>
